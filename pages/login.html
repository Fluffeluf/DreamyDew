<html>
	<head>
		<title>DreamyDew</title>
		<meta charset='utf-8'>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="../assets/css/login.css?v=1.0">
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

	</head>
	<body>
        <!--Login-Seite mit Benutzer und Username eingabe + Verlinkung zur Regestrier-Seite-->
        <img src='../assets/images/logo-mit-text.png' height="800px" style="margin-left:200px;margin-right:10px;"><br><br>
        <div class="form-wrapper">
	        <form class="login-form" method="post">
		        <h1>DreamyDew-Login</h1>
		        <br><br>
                <div class="input-group">
                    <!--Username required sonst kommt der Benutzer nicht weiter + Floating Labels-->
                    <input type='text' name='username' id="username" required>
                    <label for="username" class="floating-label">Benutzername:</label>
                </div>
                <br><br>
                <div class="input-group">
                    <!--Passwort required sonst kommt der Benutzer nicht weiter + Floating Labels-->
                    <input type='password' name='passwort' id="passwort" required>
                    <label for="passwort" class="floating-label">Passwort:</label>
                </div>
                <br><br>
                <!--Submit-Button der mit formaction die Daten weiter an Start.php weitergibt-->
                <button type='submit' formaction="../pages/start.php" title="Login">Login</button>
                <br><br>
	        </form>
            <form class="login-form"method="post">
                <a href="../pages/registrierung.html" title="Registrieren">Noch keinen Account? Jetzt Registrieren</a>
            </form>
        </div>
	</body>
</html>
